name: Gerar lockfile npm na branch auxiliar

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-lockfile.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prepare-npm-lockfile
  cancel-in-progress: true

jobs:
  lockfile:
    name: gerar-validar-publicar-branch-auxiliar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout sem credenciais persistentes
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.16.0'
      - name: Gerar lockfile com integridade do registro npm
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validar lockfile e instalação reproduzível
        run: |
          node -e "const p=require('./package-lock.json');if(p.lockfileVersion!==3||p.name!=='pope-beauty'||!p.packages[''])process.exit(1)"
          npm ci --no-audit --no-fund
      - name: Testes e build do lockfile gerado
        run: |
          npm run test
          npm run build
          npm run typecheck
      - name: Publicar SOMENTE package-lock.json na branch auxiliar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          (async()=>{
            const content=fs.readFileSync('package-lock.json').toString('base64');
            const repo=process.env.GITHUB_REPOSITORY;
            const response=await fetch('https://api.github.com/repos/'+repo+'/contents/package-lock.json',{
              method:'PUT',
              headers:{
                Authorization:'Bearer '+process.env.GH_TOKEN,
                Accept:'application/vnd.github+json',
                'X-GitHub-Api-Version':'2022-11-28',
                'Content-Type':'application/json'
              },
              body:JSON.stringify({
                message:'build(deps): lockfile npm gerado e validado',
                content,branch:'automation/npm-lockfile'
              })
            });
            if(!response.ok)throw new Error('GitHub lockfile branch update: HTTP '+response.status);
            console.log('Lockfile criado na branch auxiliar, sem alterar main.');
          })().catch(e=>{console.error(e.message);process.exit(1)});
          NODE
